name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Motor, flujo y API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[datagen,local,gcp,api,dev]"
      # El flujo corre sobre DuckDB: no necesita credenciales de GCP.
      - name: Pruebas
        run: pytest -q

  web:
    name: Portal (tipos y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
