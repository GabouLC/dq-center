name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[datagen,local,gcp,dev]"
      # El motor corre sobre DuckDB: no necesita credenciales de GCP.
      - name: Pruebas
        run: pytest -q
