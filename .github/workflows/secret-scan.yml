name: secret-scan
# Busca credenciales (claves de API, tokens, llaves privadas, cadenas de conexión) en el código y
# en el historial de git. Reglas y excepciones: .gitleaks.toml.
#
# - En un pull request revisa los commits del PR; en un push a main, los del push.
# - En la corrida semanal (y en la manual) revisa TODO el historial: por eso fetch-depth: 0.
#
# Se usa gitleaks/gitleaks-action porque dq-center está en una cuenta personal: no pide licencia.
# Si el repo pasa a una organización, la acción exigirá el secreto GITLEAKS_LICENSE; la
# alternativa es bajar el binario de gitleaks fijando versión y checksum.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # lunes 07:00 UTC (02:00 en Lima)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # la acción lista los commits del PR

jobs:
  gitleaks:
    name: Gitleaks (secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Escanear con gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Versión fija: la acción trae por defecto una más vieja que no entiende .gitleaks.toml
          # (usa [[allowlists]], desde la 8.25). Es la misma con la que se probó el archivo.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: .gitleaks.toml
          # Sin comentarios en el PR (no hace falta darle pull-requests: write); el resultado
          # queda en el check y en el resumen del job. La salida va siempre redactada.
          GITLEAKS_ENABLE_COMMENTS: "false"
